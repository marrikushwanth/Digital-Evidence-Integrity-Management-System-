name: DEIMS CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      working-directory: ./server
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov bandit
        
    - name: Run Pytest
      working-directory: ./server
      env:
        FLASK_ENV: testing
        SECRET_KEY: test_secret_key
        AES_SECRET_KEY: this_is_a_32_byte_test_key_!!!!!
        MYSQL_DATABASE: sqlite:///:memory:
      run: |
        pytest tests/ -v --cov=./
        
    - name: Run Python Security Audit (Bandit)
      working-directory: ./server
      run: |
        bandit -r . -c "bandit.yaml" || true

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      working-directory: ./client
      run: npm ci
      
    - name: Build React App
      working-directory: ./client
      run: npm run build
      
    - name: Run NPM Security Audit
      working-directory: ./client
      run: npm audit || true
